<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোকেশন ও ডিরেকশন</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* ডার্ক ম্যাজিকাল রেড ব্যাকগ্রাউন্ড */
            background: radial-gradient(circle, #2a0808 0%, #110000 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 100%; max-width: 750px; 
            background: #fffcf2; 
            padding: 50px 40px;
            border-radius: 15px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 3px solid #d4af37; 
            text-align: center; 
            position: relative;
        }

        /* কার্ডের চারকোণায় সুন্দর কর্নার ডিজাইন */
        .corner {
            position: absolute; width: 40px; height: 40px;
            border: 4px solid #d4af37;
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }

        h2 { 
            color: #7a0b10; margin-bottom: 15px; font-size: 30px; 
            font-family: 'Georgia', serif; font-weight: bold;
            border-bottom: 2px solid #d4af37; display: inline-block; padding-bottom: 10px;
        }

        p {
            color: #444; font-size: 18px; margin-bottom: 25px; line-height: 1.6;
        }

        /* গুগল ম্যাপের কন্টেইনার */
        .map-container {
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #e9e9e9;
            margin-bottom: 30px;
        }

        .map-container iframe {
            width: 100%;
            height: 350px;
            border: none;
            display: block;
        }

        /* ডিরেকশন বাটন */
        .btn-direction {
            display: inline-block; padding: 14px 35px;
            background: linear-gradient(45deg, #d4af37, #fbc02d); color: #7a0b10; 
            border: 2px solid #7a0b10; border-radius: 30px; font-size: 18px; font-weight: bold; 
            cursor: pointer; text-decoration: none; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); 
            animation: pulse 1.5s infinite; transition: 0.3s;
            margin-bottom: 15px;
        }
        .btn-direction:hover { background: #7a0b10; color: #fffcf2; border-color: #d4af37; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* পেছনের পেজে ফেরার বাটন */
        .btn-back {
            display: inline-block; margin-top: 15px; padding: 10px 30px;
            background: transparent; color: #7a0b10; border-radius: 20px; text-decoration: none;
            font-size: 16px; border: 2px solid #7a0b10; transition: 0.3s; font-weight: bold;
        }
        .btn-back:hover { background: #7a0b10; color: #fffcf2; }

        @media (max-width: 600px) {
            .container { padding: 40px 20px; }
            h2 { font-size: 26px; }
            p { font-size: 16px; }
            .map-container iframe { height: 250px; }
            .btn-direction { font-size: 16px; padding: 12px 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- চারদিকের কর্নার বর্ডার -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <h2>📍 বিয়ের স্থান ও রাস্তা</h2>
        <p>নিচের ম্যাপ থেকে বিয়ের স্থানটি দেখে নিন। আপনার বর্তমান অবস্থান থেকে সরাসরি রাস্তা জানতে নিচের বাটনে ক্লিক করুন।</p>
        
        <!-- লাইভ ম্যাপ এম্বেড -->
        <div class="map-container">
            <iframe 
                src="https://maps.google.com/maps?q=Siliguri&t=&z=14&ie=UTF8&iwloc=&output=embed" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <!-- গুগল ম্যাপ অ্যাপে ডিরেকশন খোলার লিংক -->
        <a href="https://www.google.com/maps/dir/?api=1&destination=Siliguri" target="_blank" class="btn-direction">
            🗺️ রাস্তা (Direction) দেখুন
        </a>
        <br>
        
        <!-- মজার পেজে ফিরে যাওয়ার লিংক -->
        <a href="funny.html" class="btn-back">⬅️ পেছনে ফিরে যান</a>
    </div>

</body>
</html>
