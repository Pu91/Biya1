<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লেজার কাট রেড খাম</title>
    <style>
        /* নীল রঙের ট্যাপ হাইলাইট বন্ধ করার জন্য */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body {
            background: radial-gradient(circle, #2a0808 0%, #110000 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1200px;
        }

        #envelope-section {
            transition: transform 1.5s ease, opacity 1.5s ease;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .envelope-wrapper {
            position: relative;
            width: 480px;
            height: 320px;
            animation: float 4s ease-in-out infinite; 
        }

        /* খামের পেছনের অংশ */
        .envelope-back {
            position: absolute;
            width: 100%; height: 100%;
            background: #7a0b10; 
            border-radius: 5px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            z-index: 1;
        }

        /* ম্যাজিক আলো */
        .magic-light {
            position: absolute;
            top: 20%; left: 10%; width: 80%; height: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.9) 0%, transparent 70%);
            box-shadow: 0 -20px 60px 40px rgba(255, 215, 0, 0.5);
            opacity: 0; 
            z-index: 2;
            pointer-events: none;
            transform: translateY(50px) scale(0.5);
            transition: opacity 2s ease 1s, transform 3s ease 1s;
        }

        /* ভেতরের কার্ড */
        .card {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            background: #fffcf2; 
            border: 2px solid #d4af37;
            border-radius: 5px;
            z-index: 3; /* কার্ডটি খামের বডির ভেতরে থাকবে */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #7a0b10;
            transition: transform 2.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) 2s;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2), 0 -5px 15px rgba(0,0,0,0.6);
        }

        /* কুলো আর্টের ছবি */
        .couple-img {
            height: 140px;
            width: auto;
            margin-bottom: 12px;
            border-radius: 60px 60px 10px 10px;
            border: 3px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            object-fit: cover;
        }

        .card h1 { font-size: 34px; font-weight: bold; margin-bottom: 5px; color: #b71c1c; font-family: 'Georgia', serif; }
        .card h2 { font-size: 18px; font-family: 'Georgia', serif; color: #d4af37; letter-spacing: 2px; text-transform: uppercase;}
        
        /* খামের সামনের অংশ */
        .envelope-front {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65%; 
            z-index: 4; /* এটি কার্ডের ওপরে থাকবে */
            background: #b91118; 
            border-radius: 0 0 5px 5px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.2) 2px, transparent 3px),
                              radial-gradient(circle, rgba(212, 175, 55, 0.1) 4px, transparent 5px);
            background-size: 30px 30px, 60px 60px;
        }

        .envelope-front::before {
            content: '❁';
            position: absolute;
            font-size: 180px;
            color: rgba(212, 175, 55, 0.15);
            bottom: -40px;
        }

        /* উপরের ঢাকনা */
        .flap-top-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 75%;
            z-index: 5; /* শুরুতে এটি সবার ওপরে থাকবে */
            transform-origin: top;
            /* খাম বন্ধ থাকার সময়কার অ্যানিমেশন */
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s, z-index 0s 0s;
        }

        .flap-curved {
            width: 100%; height: 100%;
            background-color: #a40a0f; 
            border-radius: 0 0 240px 240px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            background-image: radial-gradient(circle, rgba(212, 175, 55, 0.2) 2px, transparent 3px),
                              radial-gradient(circle, rgba(212, 175, 55, 0.1) 4px, transparent 5px);
            background-size: 20px 20px, 45px 45px;
            border-bottom: 3px dashed #d4af37;
            position: relative;
            overflow: hidden;
        }

        .floral-pattern {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 40px; color: rgba(212, 175, 55, 0.4);
            opacity: 0.8;
            padding: 20px;
        }

        .butterfly {
            position: absolute;
            font-size: 55px;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)) grayscale(100%) sepia(100%) hue-rotate(10deg) saturate(500%) brightness(1.2);
        }
        .b1 { top: 30%; left: 30%; transform: rotate(-15deg) scale(1.2); }
        .b2 { top: 55%; right: 30%; transform: rotate(20deg) scale(0.9); }

        /* মোমের সিল */
        .seal {
            position: absolute; left: 50%; bottom: -15px; 
            transform: translateX(-50%);
            width: 70px; height: 70px;
            background: radial-gradient(circle, #8a0b0e, #4a0000); 
            border-radius: 50%; 
            z-index: 6; 
            cursor: pointer;
            user-select: none; /* লেখা সিলেক্ট হওয়া বন্ধ করবে */
            box-shadow: inset 0 0 10px #300, 0 5px 15px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            color: #d4af37; font-weight: bold; font-size: 14px; border: 2px dashed #d4af37;
            transition: all 1s ease; 
        }
        
        .seal:hover { transform: translateX(-50%) scale(1.1); }

        .seal.melt {
            transform: translateX(-50%) scale(2) rotate(45deg);
            opacity: 0; filter: blur(10px); pointer-events: none;
        }

        /* --- নিখুঁত অ্যানিমেশন কন্ট্রোল --- */
        
        /* ঢাকনা খোলার সময় এটি বাইরের দিকে খুলবে এবং অর্ধেক খোলার পর কার্ডের পেছনে যাবে */
        .envelope-wrapper.open .flap-top-container { 
            transform: rotateX(180deg); 
            z-index: 2; /* ঢাকনা খোলার ২ সেকেন্ড পর পজিশন বদলাবে, তাই গ্লিচ হবে না */
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1) 0.8s, z-index 0s 2s;
        }
        
        .envelope-wrapper.open .magic-light { opacity: 1; transform: translateY(-100px) scale(1.5); }
        
        .envelope-wrapper.open .card { 
            transform: translateY(-200px) scale(1.05); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.7); 
        }
        
        #envelope-section.hide { transform: scale(0.7) translateY(-100vh); opacity: 0; }

        @media (max-width: 500px) {
            .envelope-wrapper { width: 340px; height: 230px; }
            .envelope-wrapper.open .card { transform: translateY(-150px) scale(1.02); }
            .couple-img { height: 100px; }
            .card h1 { font-size: 26px; }
            .flap-curved { border-radius: 0 0 170px 170px; }
            .butterfly { font-size: 40px; }
            .b1 { left: 25%; } .b2 { right: 25%; }
            .seal { width: 55px; height: 55px; font-size: 11px; bottom: -10px;}
        }
    </style>
</head>
<body>

    <div id="envelope-section">
        <div class="envelope-wrapper" id="envelope-wrapper">
            <!-- খামের পেছনের অংশ -->
            <div class="envelope-back"></div>
            
            <!-- ম্যাজিক আলো -->
            <div class="magic-light"></div>
            
            <!-- ভেতরের কার্ড ও কুলো আর্টের ছবি -->
            <div class="card" id="card">
                <img src="/biya bari card/biya card 2/handprinted-wedding-bor-bou-kulo-art-2706-3712-1_diybaazar637c6a26eb4c1.jpg" alt="Bor Bou Kulo Art" class="couple-img">
                <h1>শুভ বিবাহ</h1>
                <h2> শ্রেয়ান সুস্মিতা</h2>
            </div>
            
            <!-- খামের সামনের অংশ -->
            <div class="envelope-front"></div>

            <!-- খামের ঢাকনা -->
            <div class="flap-top-container" id="flap-top">
                <div class="flap-curved">
                    <div class="floral-pattern">
                        <span>✿</span><span>❁</span><span>✿</span>
                    </div>
                    <div class="butterfly b1">🦋</div>
                    <div class="butterfly b2">🦋</div>
                </div>
                <div class="seal" id="seal">খুলুন</div>
            </div>
        </div>
    </div>

    <script>
        const seal = document.getElementById('seal');
        const envelopeWrapper = document.getElementById('envelope-wrapper');
        const envelopeSection = document.getElementById('envelope-section');

        seal.addEventListener('click', () => {
            seal.classList.add('melt');
            envelopeWrapper.classList.add('open');
            setTimeout(() => { envelopeSection.classList.add('hide'); }, 5500); 
            setTimeout(() => { window.location.href = "family.html"; }, 6500); 
        });
    </script>
</body>
</html>
